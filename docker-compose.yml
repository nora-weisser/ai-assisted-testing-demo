services:
  # Named "web", not "app": Chrome force-upgrades the single-label host "app"
  # to HTTPS because of the HSTS-preloaded .app TLD, which breaks page.goto.
  web:
    build:
      context: ./app
    image: todo-app:local
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      # The suite relies on POST /api/test/reset for isolation, so the compose
      # stack enables it. A real deployment leaves it at the image default.
      ENABLE_TEST_ROUTES: 'true'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  playwright:
    profiles: ['test']
    # Must match the @playwright/test version in package.json exactly, or the
    # bundled browsers and the library disagree at runtime.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /work
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:3000
      CI: 'true'
    volumes:
      - .:/work
      # Anonymous volumes keep the host's macOS-built node_modules from
      # shadowing the Linux ones installed inside the container.
      - /work/node_modules
      - /work/app/node_modules
    command: sh -c "npm ci && npx playwright test"
